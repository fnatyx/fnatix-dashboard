<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fnatix ID · Pesanan</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101016">
<link rel="stylesheet" href="style.css">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('fnatixTheme')||'light')}catch(e){}</script>
</head>
<body class="locked" data-page="pesanan">
<script>document.body.classList.toggle('locked',localStorage.getItem('fnatixAuthed')!=='1')</script>
<div class="auth-gate" role="dialog" aria-label="Masuk ke Fnatix ID">
  <form class="auth-card" id="authGateForm">
    <img src="logo.png" alt="Logo Fnatix ID">
    <h1>Fnatix ID</h1>
    <p class="sub">Kelola pesanan, kas, dan laporan Fnatix ID. Masukkan password untuk melanjutkan.</p>
    <div class="field">
      <label for="authGatePassword">Password</label>
      <input class="control" type="password" id="authGatePassword" autocomplete="current-password" placeholder="Password">
    </div>
    <button class="btn btn-primary btn-lg" style="width:100%" type="submit">Masuk</button>
    <p class="auth-error" id="authGateError">Password salah, coba lagi.</p>
  </form>
</div>
<div id="shell"></div>

<main class="sheet-main">
  <div class="page-head">
    <div><h1>Pesanan</h1><p class="sub" id="orderCount">Memuat pesanan</p></div>
  </div>
  <div class="state-error" id="ordError"></div>

  <section class="card" style="margin-top:18px">
    <div class="toolbar">
      <label class="search-inline"><i data-lucide="search" class="icon"></i><input type="text" id="orderSearch" placeholder="Cari nama, layanan, atau nomor WhatsApp" aria-label="Cari pesanan"></label>
      <button type="button" class="btn btn-secondary" id="manageCategoryButton">Kelola Kategori</button>
      <button type="button" class="btn btn-primary" id="addOrderBtn">Tambah Pesanan</button>
    </div>
    <div class="table-scroll" id="ordersTableWrap">
      <table class="kas-table stacked">
        <thead><tr><th>Tanggal</th><th>Customer</th><th>Layanan</th><th>Status</th><th class="r">Jumlah</th><th></th></tr></thead>
        <tbody id="transactionTableBody"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="ordersEmpty">
      <p>Belum ada pesanan pada pencarian ini.</p>
      <button type="button" class="btn btn-primary" id="emptyAddBtn">Tambah Pesanan</button>
    </div>
    <div class="load-more-row hidden" id="loadMoreRow">
      <button type="button" class="btn btn-secondary" id="loadMoreOrdersBtn">Muat Lebih Banyak</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-gate.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="core.js"></script>
<script src="pesanan.js"></script>
</body>
</html>
